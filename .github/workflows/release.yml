name: release

# Runs when `bump-my-version` pushes a v* tag (see CONTRIBUTING.md, Releasing).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, needed to check the tag against main
      - name: The tagged commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main: merge first, then tag."
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the SmartSoft bridge DLL (shipped in the package)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686
          make -C bridge/windows package
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m build && twine check dist/*
      - name: The wheel and the sdist must contain the bridge DLL
        run: |
          unzip -l dist/*.whl | grep -q "consolelink/bridge_dll/hid.dll"
          tar tzf dist/*.tar.gz | grep -q "src/consolelink/bridge_dll/hid.dll"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing: no API token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # A GitHub Release for the tag, with generated notes to edit afterwards on the Releases page.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
