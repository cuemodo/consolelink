name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,menubar]"
      - run: python -m pytest

  bridge-dll:
    # The SmartSoft bridge's 32-bit hid.dll (bridge/windows/) must keep building: the release
    # workflow builds it the same way and ships it in the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686
      - run: make -C bridge/windows CFLAGS="-O2 -std=c11 -Wall -Wextra -Wno-cast-function-type -Werror"
