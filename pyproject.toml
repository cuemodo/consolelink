[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "consolelink"
dynamic = ["version"]
description = "Web interface and Art-Net output for ETC SmartFade ML lighting consoles, over USB"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaël Jaffrain" }]
keywords = ["lighting", "dmx", "art-net", "etc", "smartfade", "usb", "console"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia",
]
dependencies = [
    "pyusb",
    # pyusb needs the native libusb library: libusb-package bundles it, but only has wheels for these
    # platforms (no sdist). Elsewhere (32-bit Raspberry Pi OS, Windows on ARM) pyusb finds the system
    # libusb: see README (Requirements).
    "libusb-package; sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine != 'ARM64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
]

[project.optional-dependencies]
menubar = [  # the menu-bar app (consolelink-menubar); installs nothing off macOS
    "rumps; sys_platform == 'darwin'",
    "keyring; sys_platform == 'darwin'",
]
dev = ["pytest", "bump-my-version", "build", "twine"]

[project.urls]
Homepage = "https://github.com/cuemodo/consolelink"
Repository = "https://github.com/cuemodo/consolelink"
Issues = "https://github.com/cuemodo/consolelink/issues"

[project.scripts]
consolelink = "consolelink.app:main"
consolelink-menubar = "consolelink.menubar:main"

[tool.setuptools.dynamic]
version = {attr = "consolelink.protocol.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
consolelink = ["static/*", "menubar_icons/*", "bridge_dll/*.dll"]  # bridge_dll: built by `make -C bridge/windows package`

[tool.pytest.ini_options]
pythonpath = ["src"]

# `bump-my-version bump patch|minor|major` edits VERSION, commits and tags (see CONTRIBUTING.md, Releasing).
[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Version {new_version}"
# Releases are cut from main only: aborts before any file is touched on another branch.
setup_hooks = ["python scripts/require_main_branch.py"]

[[tool.bumpversion.files]]
filename = "src/consolelink/protocol.py"
search = 'VERSION = "{current_version}"'
replace = 'VERSION = "{new_version}"'
